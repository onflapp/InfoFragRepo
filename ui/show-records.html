<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="http://localhost:3000/ui/styles.css"/>
  <script src="http://localhost:3000/ui/libs.js"></script>
</head>

<body>
  <div id="result">-</div>
  <script>

    function show(data) {
      const out = document.getElementById("result");
      if (data) {
        let txt = [];
        data.records.forEach((it) => {
          txt.push('<div class="thumbnail"><img src="http://localhost:3000/api/resource/'+it+'/thumbnail.png"></div>');
        });

        out.innerHTML = txt.join('');
      }
      else {
        out.innerHTML = 'no data';
      }
    }

    init();

      show(result);
    };
    */

  </script>
</body>
</html>
